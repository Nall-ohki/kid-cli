[home]
pool = [
  "Welcome home! This is where you start.",
  "You can go to 'apps' from here!",
  "Type 'help' to see what you can do!",
  "お帰りなさい！",
  "Type 'ls' to see what's here.",
  "Type 'cd apps' to find programs!",
]

[cd]
pool = [
  "You moved! Type 'ls' to look around.",
  "Try 'pwd' to see where you are!",
  "Type 'cd ..' to go up.",
  "New place! What's here?",
]

[cd.context]
"*/apps"      = "Apps are here! Pick a category: math, abc, art, play, or code!"
"*/apps/math" = "Math games! Type 'ls' to see them all!"
"*/apps/abc"  = "Letters and words! Type 'ls' to see them all!"
"*/apps/art"  = "Art studio! Type 'ls' to see drawing and painting apps!"
"*/apps/play" = "The arcade! Type 'ls' to see games and adventures!"
"*/apps/code" = "Coding lab! Type 'ls' to see programming tools!"

[ls]
pool = [
  "These are the files and folders!",
  "Folders are blue - you can go in them with 'cd'!",
  "Pick something to explore!",
]

[discovery]
template = "You discovered `{cmd}`! {icon}"
