  "Ooh, apps! I wonder which one you'll pick today!",
]

[[rules]]
trigger = "cd:*/apps/gcompris"
responses = [
  "GCompris! It has tons of learning games inside. Type 'gcompris' to start! 🎮",
]

[[rules]]
trigger = "cd:*/apps/tuxpaint"
responses = [
  "Tux Paint! You can draw anything you want! Type 'tuxpaint' to start! 🎨",
]

[[rules]]
trigger = "cd:*/creations"
responses = [
