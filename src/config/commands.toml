[passthroughs]
ls    = "/bin/ls"
cat   = "/usr/bin/cat"
less  = "/usr/bin/less"
file  = "/usr/bin/file"
touch = "/usr/bin/touch"
echo  = "/usr/bin/echo"
whoami = "/usr/bin/whoami"
date  = "/usr/bin/date"
tmux  = "/usr/bin/tmux"
reset = "/usr/bin/reset"
bash  = "/usr/bin/bash"
base64 = "/usr/bin/base64"
iconv = "/usr/bin/iconv"
mkdir = "/bin/mkdir"
rmdir = "/bin/rmdir"
pwd   = "/bin/pwd"
wc    = "/usr/bin/wc"
head  = "/usr/bin/head"
tail  = "/usr/bin/tail"
grep  = "/bin/grep"
cal   = "/usr/bin/cal"
nano  = "/usr/bin/nano"
rm    = "/bin/rm"
mv    = "/bin/mv"
cp    = "/bin/cp"
sl    = "/usr/games/sl"
uv    = "/usr/local/bin/uv"

[blocks]
commands = ["sudo", "ssh", "curl", "wget", "su", "scp", "sftp", "wall"]
message = "{cmd} is not allowed... you are not going to get to use this one for a while."
