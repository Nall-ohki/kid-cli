[launchers.matrix]
binary = "/usr/bin/cmatrix"
pane = "bottom"
lolcat = "never"
persist = false

[launchers.say]
binary = "/usr/games/cowsay"
pane = "companion"
lolcat = "never"
persist = true

[launchers.letters]
binary = "/usr/bin/figlet"
pane = "bottom"
lolcat = "never"
persist = true

[launchers.sl]
binary = "/usr/games/sl"
pane = "bottom"
lolcat = { chance = 0.25 }
persist = false

[launchers.nyan]
binary = "/usr/bin/nyancat"
pane = "bottom"
lolcat = "never"
persist = false

[launchers.ll]
binary = "/bin/ls -la"
pane = "none"
lolcat = "never"
persist = false
builtin = true

[launchers.help]
binary = "{KID} help"
pane = "popup"
lolcat = "never"
persist = false
builtin = true

[launchers.man]
binary = "/usr/bin/man"
pane = "popup"
lolcat = "never"
persist = true

[launchers.tuxpaint]
category = "art"
binary = "tuxpaint"
pane = "none"
lolcat = "never"
persist = false
gui = true

[systems.apple2gs]
template = "mame apple2gs -rompath {rom_dir} -skip_gameinfo -nowindow -flop3 {rom_path}"
rom_dir = "/kid/emulation/disks/apple2gs"

[systems.snes]
template = "retroarch -L /usr/lib/*/libretro/bsnes_mercury_performance_libretro.so --config {home}/.config/retroarch/retroarch.cfg {rom_path}"
rom_dir = "/kid/emulation/disks/snes"

[systems.snes-mouse]
template = "retroarch -L /usr/lib/*/libretro/bsnes_mercury_performance_libretro.so -d 1:2 --config {home}/.config/retroarch/retroarch.cfg --appendconfig {home}/.config/retroarch/mouse.cfg {rom_path}"
rom_dir = "/kid/emulation/disks/snes"

[systems.scummvm]
template = "scummvm -f --path={rom_path} --auto-detect"
rom_dir = "/kid/emulation/disks/scummvm"

[systems.dosbox]
template = "dosbox -fullscreen -exit -c \"imgmount d {rom_path} -t iso\" -c \"d:\""
rom_dir = "/kid/emulation/disks/dosbox"

[systems.dosbox-carmen]
template = "dosbox -fullscreen -exit -c \"imgmount d {rom_path} -t iso\" -c \"d:\" -c \"carmen.exe\""
rom_dir = "/kid/emulation/disks/dosbox"

[systems.dosbox-donald]
template = "dosbox -fullscreen -exit -c \"mount c {rom_path}\" -c \"c:\" -c \"donald.exe\""
rom_dir = "/kid/emulation/disks/dosbox"

