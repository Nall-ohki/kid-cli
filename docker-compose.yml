services:
  kid:
    build: .
    image: kid-env:latest
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      # Bind mount for creations in the host user's home directory
      - ${KID_CREATIONS_DIR:-./creations}:/home/kid/creations
      - ${KID_ROMS_DIR:-/opt/kid-cli/assets/roms}:/kid/emulation/disks:ro
      # Named volumes for saving progress and history
      - tuxpaint-data:/home/kid/.tuxpaint
      - gcompris-data:/home/kid/.config/gcompris
      - zsh-history:/home/kid/.zsh_history
      # Direct passage to host devices for Wayland/GPU/input/sound
      - /dev:/dev
      - /run/udev:/run/udev
    environment:
      - TERM=xterm-256color
      - XDG_RUNTIME_DIR=/tmp/runtime-kid

volumes:
  tuxpaint-data:
  gcompris-data:
  zsh-history:
