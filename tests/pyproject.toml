[project]
name = "kid-tests"
version = "0.1.0"
description = "Integration tests for the Kid Environment via Docker"
requires-python = ">=3.11"

dependencies = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-n auto -v"
testpaths = ["."]
