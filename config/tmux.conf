# Native Kid-Friendly Tmux Configuration
# Focus on stability, ease of use (mouse), and "Coach" branding.

# 1. Basics & Keybinds
# Set prefix to Ctrl-a (standard ergonomic choice)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support (essential for scrolling and pane selection)
set -g mouse on

# 2. UI & Branding
# Show pane titles on top (where we display "Companion" or "Coach")
set -g pane-border-status top
set -g pane-border-format " [ #T ] "

# High-contrast borders
set -g pane-active-border-style fg=green
set -g pane-border-style fg=blue

# Status Bar (Minimal to reduce distraction)
set -g status-style bg=black,fg=white
set -g status-left "#[fg=blue] KID #[default]"
set -g status-right "#[fg=green]%H:%M #[default]"

# 3. Performance & Stability
set -s escape-time 0
set -g history-limit 10000
set -g default-terminal "xterm-256color"

# 4. Easier Window/Pane Management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# 5. Environment Propagation
# tmux strips many environment variables by default.
# We MUST preserve Wayland variables so GUI apps can connect to cage!
set-option -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR QT_QPA_PLATFORM SIMULATOR"
